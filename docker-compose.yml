name: splitit

services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_DB: splitit
      POSTGRES_USER: splitit
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitit -d splitit"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.12-alpine

  migrate:
    image: splitit-api:local
    build: ./api
    command: ["migrate"]
    environment:
      DB_HOST: postgres
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: splitit-api:local
    build: ./api
    environment:
      DB_HOST: postgres
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_ADDR: redis:6379
    secrets:
      - db_password
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  web:
    image: splitit-web:local
    build: ./web

  gateway:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine-slim
    ports:
      - "8080:8080"
    volumes:
      - ./compose/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

secrets:
  db_password:
    file: ./secrets/db_password

volumes:
  pgdata:
