apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argocd
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 8000
      protocol: HTTP
      hostname: argocd.eks.hamzahsahal.com
    - name: https
      port: 8443
      protocol: HTTPS
      hostname: argocd.eks.hamzahsahal.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: argocd-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-redirect
  namespace: argocd
spec:
  parentRefs:
    - name: argocd
      sectionName: http
  hostnames:
    - argocd.eks.hamzahsahal.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: argocd
      sectionName: https
  hostnames:
    - argocd.eks.hamzahsahal.com
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
