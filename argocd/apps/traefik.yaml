apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.4.1
    helm:
      valuesObject:
        deployment:
          replicas: 2
        podDisruptionBudget:
          enabled: true
          maxUnavailable: 1
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
            matchLabelKeys:
              - pod-template-hash
        providers:
          kubernetesGateway:
            enabled: true
        gateway:
          enabled: false
        metrics:
          prometheus:
            service:
              enabled: true
            serviceMonitor:
              enabled: true
        service:
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
          spec:
            loadBalancerClass: service.k8s.aws/nlb
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
    syncOptions:
      - CreateNamespace=true
