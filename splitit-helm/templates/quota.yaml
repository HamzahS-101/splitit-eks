apiVersion: v1
kind: ResourceQuota
metadata:
  name: splitit
  namespace: {{ .Release.Namespace }}
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1536Mi
    limits.memory: 3Gi
    pods: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: splitit
  namespace: {{ .Release.Namespace }}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        memory: 128Mi
      max:
        memory: 1Gi
